[project]
name = "renpy-imageforge"
version = "0.2.0"
description = "Tool macOS per crop, resize e upscaling AI di immagini di giochi Ren'Py"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
    "pillow-heif>=1.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
imageforge = "batch_cropper.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["batch_cropper"]
