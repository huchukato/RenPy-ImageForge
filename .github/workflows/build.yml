name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: RenPy ImageForge-macOS.dmg
            pattern: dist/RenPy ImageForge-macOS.*
          - os: ubuntu-latest
            artifact: RenPy ImageForge-Linux.tar.gz
            pattern: dist/RenPy ImageForge-Linux.*
          - os: windows-latest
            artifact: RenPy ImageForge-Windows.zip
            pattern: dist/RenPy ImageForge-Windows.*

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build
        shell: bash
        run: ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}

      - name: Upload source
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: RenPy ImageForge-source
          path: dist/RenPy ImageForge-source.*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
